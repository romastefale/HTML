name: Deploy GitHub Pages
# Builds the React app (Vite) and publishes dist/ with actions/deploy-pages.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # tsc --noEmit + vite build → dist/
      - name: Check Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type || echo unknown)
          if [ "$src" != "workflow" ]; then
            echo "::warning::Pages source is '$src'. Switch Settings → Pages → Source to 'GitHub Actions', otherwise the branch build also publishes the unbuilt sources."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
