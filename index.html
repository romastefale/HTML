<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- Android Chrome paints its top bar solid in theme-color: it equals the top
     edge of the page gradient (--page-edge in src/styles/global.css), so the
     bar reads as the page. Safari 26 ignores theme-color and tints its bars
     from the page itself (body/html background-color, or a fixed element at
     the edge — we have none with a background). -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#8b82e6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1646">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Interface">
<title>Interface de vidro</title>
<meta name="description" content="Página inicial em vidro líquido: menu que se recolhe ao rolar e pesquisa na página.">
<!-- First paint (before the CSS/JS bundle): the bar colour is already right. -->
<style>html,body{margin:0;background-color:#8b82e6}@media (prefers-color-scheme:dark){html,body{background-color:#1b1646}}</style>
</head>
<body>
<div id="root"></div>
<noscript><div class="noscript"><strong>Esta página precisa de JavaScript.</strong> Ela é um app React que usa a biblioteca liquid-glass para desenhar o vidro. Ative o JavaScript para ver o conteúdo.</div></noscript>
<script type="module" src="/src/home.tsx"></script>
</body>
</html>
