<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- Android Chrome paints its top bar solid in theme-color: it is the top
     bar's colour (its translucent fill over the page's top edge; BAR_COLOR in
     src/lib/theme.ts), so the browser bar and ours read as one. Safari 26
     ignores theme-color and tints from the fixed bar at the top edge. The
     inline script below overrides both tags with the chosen mode. -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#d2d1f1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0a19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Interface">
<title>Interface de vidro</title>
<meta name="description" content="Página inicial em vidro líquido: barra de menu com rolagem lateral, modo claro/escuro e pesquisa na página.">
<!-- Theme before first paint (no flash): the stored choice (localStorage
     "lg-theme", as in the fork's site/src/theme.ts), else the system setting.
     It also points theme-color at the top bar's colour for that mode. -->
<script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem("lg-theme")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";d.setAttribute("data-theme",t);d.style.colorScheme=t;var c=t==="dark"?"#0c0a19":"#d2d1f1",m=document.querySelectorAll('meta[name="theme-color"]');for(var i=0;i<m.length;i++)m[i].setAttribute("content",c)})()</script>
<!-- First paint (before the CSS/JS bundle): html/body already in the mode's colour. -->
<style>html,body{margin:0;background-color:#8b82e6}html[data-theme=dark],html[data-theme=dark] body{background-color:#1b1646}</style>
</head>
<body>
<div id="root"></div>
<noscript><div class="noscript"><strong>Esta página precisa de JavaScript.</strong> Ela é um app React que usa a biblioteca liquid-glass para desenhar o vidro. Ative o JavaScript para ver o conteúdo.</div></noscript>
<script type="module" src="/src/home.tsx"></script>
</body>
</html>
